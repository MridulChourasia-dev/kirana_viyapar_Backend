# ============================================================================
# Nginx Upstream Configuration for Viyapar Backend
# ============================================================================
# This file defines the backend upstream server configuration
# ============================================================================

# Health check endpoint configuration
server {
    listen 8001;
    listen [::]:8001;
    server_name _;
    access_log off;

    # Backend health check
    location /nginx_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.20.0.0/16;  # Docker network
        deny all;
    }
}

# Backend API routing
server {
    listen 8000;
    listen [::]:8000;
    server_name backend;

    # Default content type
    default_type text/html;

    # Disable default server tokens
    server_tokens off;

    # Main API handling (proxy placeholder for testing)
    location / {
        return 200 "Backend is healthy\n";
        add_header Content-Type text/plain;
    }

    # Health endpoint
    location /health {
        return 200 "OK";
        add_header Content-Type text/plain;
    }

    # Status endpoint for monitoring
    location /status {
        return 200 "{\"status\":\"online\",\"timestamp\":$(date +%s)}\n";
        add_header Content-Type application/json;
    }
}
