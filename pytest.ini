[pytest]
# Pytest configuration

# Python path
pythonpath = tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Asyncio mode
asyncio_mode = auto

# Output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings

# Markers
markers =
    auth: Auth API tests
    customers: Customer API tests
    products: Product API tests
    invoices: Invoice API tests
    payments: Payment API tests
    reports: Report API tests
    negative: Negative/error tests
    asyncio: Async tests

# Test paths
testpaths = tests

# Timeout (seconds)
timeout = 30

# Logging
log_cli = false
log_cli_level = INFO
